# =============================================================================
# Bano Zypp Ke CM — path mount on the existing zypp.app domain
# =============================================================================
#
# Drop these two blocks into the EXISTING zypp.app server block. Nothing here
# replaces the live site: both locations are scoped to /bano-zypp-ke-cm, so
# every other path keeps hitting whatever already serves zypp.app.
#
# The result is one origin for both the page and its API, which is why the
# frontend needs no CORS handling and no preflight round-trip.
#
#   https://zypp.app/bano-zypp-ke-cm/      -> static build (web/dist)
#   https://zypp.app/bano-zypp-ke-cm/api/  -> api container on :3001
#
# ORDER MATTERS: the /api/ block must come first. nginx matches prefix
# locations longest-first so it would win anyway, but keeping it above the
# static block makes that obvious to whoever reads this next.
# =============================================================================

# --- API ---------------------------------------------------------------------
location /bano-zypp-ke-cm/api/ {
    # The trailing slash on proxy_pass is what strips the prefix: nginx
    # forwards /bano-zypp-ke-cm/api/cm-applications to the container as
    # /api/cm-applications. That is why the Express app mounts its routes at
    # the root and knows nothing about where it sits in the public URL space.
    proxy_pass http://127.0.0.1:3001/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The rate limiter buckets by client IP. Without this the API sees every
    # request as coming from nginx, so one applicant could lock out everyone.
    # Pair it with TRUST_PROXY=1 in the API's environment.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Submissions are small and fast; a hung upstream should surface quickly
    # rather than holding the connection open for the default 60s.
    proxy_connect_timeout 5s;
    proxy_send_timeout    20s;
    proxy_read_timeout    20s;

    # Nothing here is cacheable — every response is either a write result or
    # an authenticated read.
    add_header Cache-Control "no-store" always;
}

# --- Static page -------------------------------------------------------------
location /bano-zypp-ke-cm/ {
    alias /var/www/bano-zypp-ke-cm/;

    # Single page, no client-side router: fall back to index.html so a stray
    # deep link still lands on the campaign rather than an nginx 404 page.
    try_files $uri $uri/ /bano-zypp-ke-cm/index.html;

    # Vite fingerprints asset filenames, so they can be cached hard and
    # immutably. index.html must never be, or a deploy would not be picked up.
    location ~* ^/bano-zypp-ke-cm/assets/ {
        alias /var/www/bano-zypp-ke-cm/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /bano-zypp-ke-cm/index.html {
        alias /var/www/bano-zypp-ke-cm/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Security headers for the document itself.
    #
    # The CSP allows Google Fonts because the campaign's display faces
    # (Anton, Archivo Black, Space Grotesk) load from there. `style-src` needs
    # 'unsafe-inline' because React sets the carousel's transform via an inline
    # style attribute. No script host is allowed beyond 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
