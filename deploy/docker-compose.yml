# =============================================================================
# Bano Zypp Ke CM — API service
# =============================================================================
#
# Only the API runs as a container. The frontend is a pile of static files that
# the existing zypp.app nginx serves directly from /var/www/bano-zypp-ke-cm —
# putting a second nginx in front of it would just add a hop.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# =============================================================================

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: bano-zypp-ke-cm-api:latest
    restart: unless-stopped

    # Bound to loopback, NOT 0.0.0.0. The only thing that should reach this
    # port is the nginx on the same host; publishing it publicly would put an
    # admin API on the internet guarded by nothing but a bearer token.
    ports:
      - "127.0.0.1:3001:3001"

    # Secrets stay in a file that is never committed. See api/.env.example.
    env_file:
      - ../api/.env

    environment:
      NODE_ENV: production
      PORT: "3001"
      # One proxy in front (nginx), so req.ip resolves to the real client and
      # the rate limiter buckets per applicant rather than per server.
      TRUST_PROXY: "1"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Local development only.
  #
  # The outbox writes an application and its notification event in ONE
  # transaction, and MongoDB only allows that on a replica set — a standalone
  # mongod would make the API refuse to boot. `--replSet rs0` plus the one-shot
  # initiator below gives a single-node replica set, which is enough.
  #
  # Not used in production: point MONGODB_URI at Atlas, already a replica set.
  #
  #   docker compose -f deploy/docker-compose.yml --profile local-db up -d
  # ---------------------------------------------------------------------------
  mongo:
    profiles: ["local-db"]
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-init:
    profiles: ["local-db"]
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >
        sleep 5 &&
        mongosh --host mongo:27017 --eval
        'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

volumes:
  mongo-data:
