<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05071f" />

    <!--
      Meta tags live here, static, rather than being injected at runtime.

      This is one page with one fixed set of tags, so there is nothing for a
      head-manager library to manage — and static tags are strictly better at
      the job these tags exist to do: a crawler or a WhatsApp/LinkedIn link
      unfurler reads the served HTML and never runs the bundle, so anything
      injected by React is invisible to exactly the audience it is meant for.
    -->
    <title>Bano Zypp Ke CM — Fresher to CM in 90 Days | Zypp Electric</title>
    <meta
      name="description"
      content="Run every Zypp hub in a city for 90 days. Real teams, a real city P&amp;L, real gig partners. Best City Manager wins ₹50,000 cash and a ₹15 LPA permanent role. No MBA. No experience. Just hunger."
    />
    <meta
      name="keywords"
      content="Zypp Electric careers, city manager, fresher jobs India, 90 day programme, no MBA, gig economy jobs"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Zypp Electric" />
    <link rel="canonical" href="https://zypp.app/bano-zypp-ke-cm/" />

    <meta property="og:title" content="Ab Fresher Banega CM — Bano Zypp Ke CM" />
    <meta
      property="og:description"
      content="90 days running every Zypp hub in a city. Win ₹50,000 cash + ₹15 LPA CTC. Degree nahi chahiye, sirf hunger chahiye."
    />
    <meta property="og:url" content="https://zypp.app/bano-zypp-ke-cm/" />
    <meta property="og:site_name" content="Zypp Electric" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ab Fresher Banega CM — Bano Zypp Ke CM" />
    <meta
      name="twitter:description"
      content="90 days running every Zypp hub in a city. Win ₹50,000 cash + ₹15 LPA CTC. Degree nahi chahiye, sirf hunger chahiye."
    />

    <!--
      TODO before launch: add an og:image. A recruitment campaign lives on
      WhatsApp and LinkedIn shares, and without one those render as a bare link.
      Drop a 1200x630 image in public/ and uncomment:
      <meta property="og:image" content="https://zypp.app/bano-zypp-ke-cm/og.png" />
      <meta name="twitter:image" content="https://zypp.app/bano-zypp-ke-cm/og.png" />
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- cm.css is scoped to .bano-cm, so the browser's default 8px body margin needs resetting here. -->
    <style>
      body {
        margin: 0;
        background: #05071f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
