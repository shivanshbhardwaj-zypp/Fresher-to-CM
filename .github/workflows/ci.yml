name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless — cancel it
# rather than queueing behind work that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The suite starts its own in-memory MongoDB replica set, so there is no
      # service container here and no credentials to hand CI.
      - run: npm test

      - run: npm run build

  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - run: npm run build

      # The page is served from a path, not a root. If `base` is ever dropped
      # from vite.config.ts the build still succeeds and every asset 404s in
      # production — so fail here instead of there.
      - name: Assert the /bano-zypp-ke-cm/ asset prefix is present
        run: |
          if ! grep -q "/bano-zypp-ke-cm/assets/" dist/index.html; then
            echo "::error::built index.html has no /bano-zypp-ke-cm/ asset prefix — check 'base' in vite.config.ts"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
